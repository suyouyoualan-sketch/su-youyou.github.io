media:
  input: assets/uploads
  output: /assets/uploads

content:
  - name: website
    label: Website content
    type: file
    path: content/site.json
    fields:
      - name: site
        label: Site settings
        type: object
        fields:
          - { name: language, label: Page language, type: string, default: en }
          - { name: title, label: Browser title, type: string }
          - { name: description, label: Search description, type: text }
      - name: profile
        label: Profile
        type: object
        fields:
          - { name: name, label: Name, type: string }
          - { name: nameZh, label: Name in Chinese, type: string, required: false }
          - { name: role, label: Professional role, type: string }
          - { name: headline, label: Headline, type: text }
          - { name: affiliation, label: Affiliation, type: string, required: false }
          - { name: location, label: Location, type: string, required: false }
          - { name: email, label: Email, type: string, required: false }
          - { name: portrait, label: Portrait photo, type: image, required: false }
          - { name: cv, label: CV or résumé PDF, type: file, required: false }
      - name: about
        label: About paragraphs
        type: string
        list: true
      - name: researchInterests
        label: Research interests
        type: object
        list: true
        fields:
          - { name: name, label: Interest, type: string }
      - name: publications
        label: Publications
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: authors, label: Authors, type: string, required: false }
          - { name: venue, label: Journal or venue, type: string, required: false }
          - { name: year, label: Year, type: string, required: false }
          - { name: summary, label: Short summary, type: text, required: false }
          - { name: url, label: External link, type: string, required: false }
          - { name: pdf, label: PDF, type: file, required: false }
      - { name: allPublicationsUrl, label: Full publication list URL, type: string, required: false }
      - name: projects
        label: Projects
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: description, label: Description, type: text, required: false }
          - { name: url, label: Link, type: string, required: false }
      - name: experience
        label: Experience
        type: object
        list: true
        fields:
          - { name: period, label: Period, type: string, required: false }
          - { name: title, label: Position, type: string }
          - { name: organization, label: Organization, type: string, required: false }
          - { name: description, label: Description, type: text, required: false }
      - name: education
        label: Education
        type: object
        list: true
        fields:
          - { name: period, label: Period, type: string, required: false }
          - { name: title, label: Degree, type: string }
          - { name: organization, label: Institution, type: string, required: false }
          - { name: description, label: Description, type: text, required: false }
      - name: links
        label: Profile links
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - { name: url, label: URL, type: string }
